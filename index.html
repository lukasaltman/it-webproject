<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <title>NBA Web</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightgray;
        }

        header {
            background-color: darkblue;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: white;
        }

        nav {
            background-color: black;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            color: orange;
            font-size: 20px;
        }

        main {
            text-align: center;
            padding: 30px;
        }

        h2 {
            color: darkblue;
        }

        .tym {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            transition: 0.3s;
        }

        .tym:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <header>
        <h1>NBA World</h1>
        <p>Vše o basketbalu</p>
    </header>

    <nav>
        <a href="#">Domů</a>
        <a href="#">Týmy</a>
        <a href="#">Hráči</a>
        <a href="#">Zápasy</a>
    </nav>

    <main>

        <h2>Vítej na NBA World</h2>

        <p>
            Tento web je věnovaný basketbalu a nejlepší basketbalové lize na světě.
        </p>

        <h2>Oblíbené týmy</h2>

        <div class="tym">
            <img src="https://cdn.nba.com/logos/nba/1610612747/primary/L/logo.svg" alt="Logo Los Angeles Lakers"
            <h3>Los Angeles Lakers</h3>
            <p>Jeden z nejslavnějších týmů NBA.</p>
        </div>

        <div class="tym">
            <img src="https://cdn.nba.com/logos/nba/1610612759/primary/L/logo.svg" alt="Logo San Antonio Spurs">
            <h3>San Antonio Spurs</h3>
            <p>Tým známý především díky mladým potencionálním hráčům.</p>
        </div>

    </main>

</body>

</html>
